services:
  builder:
    image: devenv-builder
    build:
      context: ..
      dockerfile: devenv/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}

    container_name: openwrt-builder

    working_dir: /repo/openwrt

    stdin_open: true
    tty: true

    user: "0:0"

    network_mode: host

    environment:
      # The builder runs as root (see `user` above), and GNU tar's configure
      # aborts with "you should not run configure as root" without this.
      FORCE_UNSAFE_CONFIGURE: "1"

    volumes:
      - ${OPENWRT_REPO_DIR:-..}:/repo

    command: ["/bin/bash"]
